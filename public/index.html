<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>buyKaro.</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="/index.html" class="logo">
        <span class="logo-badge">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 8h12l-1 12H7L6 8Z" />
            <path d="M9 8V6a3 3 0 0 1 6 0v2" />
          </svg>
        </span>
        <span class="brand-name">buyKaro</span><span class="brand-dot">.</span>
      </a>

      <button id="hamburger-btn" class="hamburger-btn" aria-label="Toggle menu">
        <svg
          class="icon-open"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
        <svg
          class="icon-close"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>

      <nav id="nav-links">
        <a href="/index.html" class="nav-link">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 11.5 12 5l8 6.5" />
            <path d="M6 10v9h12v-9" />
            <path d="M10 19v-5h4v5" />
          </svg>
          Home
        </a>
        <a href="/cart.html" class="nav-link">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="18" cy="20" r="1.4" />
            <path
              d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6.2"
            />
          </svg>
          Cart
        </a>
        <a href="/orders.html" class="nav-link">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" />
            <path d="M9 8h6M9 12h6" />
          </svg>
          Orders
        </a>
        <span id="auth-links">
          <a href="/login.html" class="nav-link">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M10 17v1a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-5a2 2 0 0 0-2 2v1"
              />
              <path d="M14 12H3m0 0 3.5-3.5M3 12l3.5 3.5" />
            </svg>
            Login
          </a>
          <a href="/signup.html" class="nav-link">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="8" r="3.2" />
              <path d="M3.5 19c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5" />
              <path d="M18 8v5M15.5 10.5h5" />
            </svg>
            Signup
          </a>
        </span>
        <span id="user-info">
          <span class="user-email-badge">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8.5" r="3.2" />
              <path d="M5.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
            </svg>
            <span id="user-email"></span>
          </span>
          <button id="logout-btn" class="btn-secondary">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 7V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1"
              />
              <path d="M10 12h11m0 0-3.5-3.5M21 12l-3.5 3.5" />
            </svg>
            Logout
          </button>
        </span>
        <button
          id="theme-toggle-btn"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4.2" />
            <path
              d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"
            />
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" />
          </svg>
        </button>
      </nav>
    </header>
    <main>
      <section class="controls">
        <div class="controls-main">
          <div class="search-wrap">
            <svg
              id="search-icon-btn"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              role="button"
              aria-label="Search"
              tabindex="0"
            >
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M20 20l-4.3-4.3" />
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Search products..."
            />
          </div>

          <select id="sort-select">
            <option value="">Sort by</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>

          <select id="category-select">
            <option value="">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Footwear">Footwear</option>
            <option value="Clothing">Clothing</option>
            <option value="Furniture">Furniture</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Accessories">Accessories</option>
            <option value="Stationery">Stationery</option>
            <option value="Fitness">Fitness</option>
            <option value="Home">Home</option>
            <option value="Office">Office</option>
          </select>

          <div class="advanced-filter-wrap">
            <button
              type="button"
              id="advanced-filter-btn"
              class="filter-toggle-btn"
              aria-expanded="false"
              aria-controls="advanced-filter-panel"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3.5 5h17L14 12.5V19l-4 2v-8.5L3.5 5Z" />
              </svg>
              Filters
              <span class="filter-count" id="filter-count">0</span>
            </button>

            <div id="advanced-filter-panel" class="filter-panel">
              <div class="filter-panel-row">
                <label for="min-price">Min Price</label>
                <input type="number" id="min-price" placeholder="₹ Min" />
              </div>
              <div class="filter-panel-row">
                <label for="max-price">Max Price</label>
                <input type="number" id="max-price" placeholder="₹ Max" />
              </div>
              <div class="filter-panel-actions">
                <button
                  type="button"
                  id="clear-filters-btn"
                  class="btn-secondary"
                >
                  Clear
                </button>
                <button type="button" id="apply-filters-btn">
                  Apply Filters
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="product-list" class="product-grid">
        <!-- product cards injected here by products.js -->
      </section>

      <section class="pagination">
        <button id="prev-btn" class="btn-secondary">Prev</button>
        <span id="page-label">Page 1</span>
        <button id="next-btn" class="btn-secondary">Next</button>
      </section>
    </main>
    <footer class="site-footer">
      <p>Built by Ansh Kumar Vishwakarma</p>
      <div class="footer-links">
        <a
          href="https://github.com/itisansh"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.6 2.8 5.5 3.1 5.5 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.1 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.1-.5 2V21"
            />
          </svg>
          GitHub
        </a>
        <a
          href="https://www.linkedin.com/in/ansh-kumar-vishwakarma-326987328/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path
              d="M7.5 10.5v6M7.5 7.8v.01M11.5 16.5v-3.6c0-1.5 1-2.4 2.3-2.4 1.3 0 2.2.9 2.2 2.4v3.6"
            />
          </svg>
          LinkedIn
        </a>
        <a href="mailto:itsokayansh@gmail.com">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3.5 6.5 12 13l8.5-6.5" />
          </svg>
          Email
        </a>
      </div>
    </footer>

    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/products.js"></script>
  </body>
</html>
