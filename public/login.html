<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="/index.html" class="logo">ShopEase</a>
    <button id="hamburger-btn" class="hamburger-btn" aria-label="Toggle menu">☰</button>
    <nav id="nav-links">
      <a href="/index.html">Home</a>
      <a href="/cart.html">Cart</a>
      <a href="/orders.html">Orders</a>
      <span id="auth-links">
        <a href="/login.html">Login</a>
        <a href="/signup.html">Signup</a>
      </span>
      <span id="user-info">
        <span id="user-email"></span>
        <button id="logout-btn">Logout</button>
      </span>
    </nav>
  </header>

  <main class="auth-form">
    <h1>Login</h1>
    <div id="login-error" class="error-message" style="display:none;"></div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password">
    </div>

    <button id="login-btn">Login</button>
    <p>Don't have an account? <a href="/signup.html">Signup</a></p>
  </main>

  <footer class="site-footer">
    <p>Built by Ansh Kumar Vishwakarma</p>
    <div class="footer-links">
      <a href="https://github.com/itisansh" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/ansh-kumar-vishwakarma-326987328/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="mailto:itsokayansh@gmail.com">Email</a>
    </div>
  </footer>

  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
